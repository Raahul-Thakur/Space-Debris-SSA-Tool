services:
  - type: web
    name: sdebris-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: SDEBRIS_ENV
        value: production
      - key: SDEBRIS_JOB_BACKEND
        value: redis
      - key: SDEBRIS_DATABASE_URL
        sync: false
      - key: SDEBRIS_REDIS_URL
        sync: false
      - key: SDEBRIS_AUTH_JWKS_URL
        sync: false
      - key: SDEBRIS_AUTH_ISSUER
        sync: false
      - key: SDEBRIS_AUTH_AUDIENCE
        value: authenticated
      - key: SDEBRIS_CORS_ORIGINS
        sync: false
