services:
  - type: web
    name: sdebris-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: SDEBRIS_ENV
        value: production
      # The free plan runs a single instance, so screening executes in the API
      # process and no Redis broker or separate worker is needed. Switch this
      # to "redis" and add SDEBRIS_REDIS_URL for a durable queue.
      - key: SDEBRIS_JOB_BACKEND
        value: thread
      - key: SDEBRIS_DATABASE_URL
        sync: false
      - key: SDEBRIS_AUTH_JWKS_URL
        sync: false
      - key: SDEBRIS_AUTH_ISSUER
        sync: false
      - key: SDEBRIS_AUTH_AUDIENCE
        value: authenticated
      - key: SDEBRIS_CORS_ORIGINS
        sync: false
      # Optional: a regular expression matching Vercel preview domains, so
      # preview deployments can reach the API. See docs/deployment-free-tier.md.
      - key: SDEBRIS_CORS_ORIGIN_REGEX
        sync: false
      # Shared with Vercel. Proves a request arrived through the caching
      # edge rather than from a browser, which exempts it from the
      # per-address anonymous allowance -- behind a cache every visitor
      # shares an address, so metering it would throttle everyone as one
      # client. Leave unset and nothing breaks; the exemption simply does
      # not apply. See docs/capacity.md.
      - key: SDEBRIS_PROXY_TOKEN
        sync: false
      # Signing secret from the Dodo Payments webhook settings. Without it the
      # billing webhook refuses every delivery with 503 rather than trusting
      # unsigned input.
      - key: SDEBRIS_BILLING_WEBHOOK_SECRET
        sync: false
