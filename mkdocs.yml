site_name: Space Debris SSA Tool
site_description: Conjunction screening and collision-avoidance awareness from live TLE data.
site_url: https://raahul-thakur.github.io/Space-Debris-SSA-Tool/
repo_url: https://github.com/Raahul-Thakur/Space-Debris-SSA-Tool
repo_name: Raahul-Thakur/Space-Debris-SSA-Tool
theme:
  name: material
  palette:
    - scheme: slate
      primary: indigo
      accent: light blue
  features:
    - navigation.sections
    - content.code.copy

nav:
  - Home: index.md
  - Usage: usage.md
  - Architecture: architecture.md
  - Operational ontology: ontology.md
  - Methodology: methodology.md
  - Free-tier deployment: deployment-free-tier.md

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - tables
