name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[api,dev]"
      - name: Lint
        run: ruff check src tests
      - name: Run tests with coverage
        run: pytest --cov=sdebris --cov-report=term-missing --cov-report=xml
      - name: Check database migrations
        # `check` compares the models against a migrated database, so the
        # schema has to be built first. Without the upgrade it fails with
        # "target database is not up to date", which went unnoticed while the
        # lint step above was failing and stopping the job before this ran.
        env:
          SDEBRIS_DATABASE_URL: sqlite:///ci-migration-check.sqlite
        run: |
          alembic upgrade head
          alembic check
      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Audit shipped dependencies
        # Scoped to what reaches a browser. The development tree carries
        # advisories in the linter's glob chain (braces, micromatch, reached
        # through eslint-config-next) whose advisory covers every published
        # version, so there is nothing to upgrade to; npm's only offered
        # remedy is downgrading eslint-config-next to 14.x, which does not
        # work with Next 16. Failing the build on an unfixable development
        # advisory trains people to ignore the step.
        run: npm audit --omit=dev --audit-level=high
      - name: Report development advisories
        continue-on-error: true
        run: npm audit --audit-level=high
      - run: npm run build
      - name: Build the Cloudflare Pages export
        # Production is this static export plus functions/. A route handler
        # or server-only API slipping into app/ breaks it, so it is built on
        # every push rather than discovered at deploy time.
        run: |
          npm run build:cloudflare
          test -f out/index.html
          test -f out/_headers
          test ! -e out/api
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: sdebris:test
