name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only by default; nothing here writes to the repository.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        # Runtime dependencies from the hash-checked lockfile, exactly as the
        # container gets them; then the package itself and the dev tools.
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-lock.txt
          pip install --no-deps -e .
          pip install -e ".[dev]"
      - name: Check the lockfile matches pyproject.toml
        if: matrix.python-version == '3.12'
        run: |
          pip install "uv>=0.11,<0.12"
          # Seeded with the committed lockfile, so uv keeps every pin that
          # still satisfies pyproject.toml. Resolving from scratch would pick
          # up each new upstream release and fail on commits that changed
          # no dependency at all. This fails only when pyproject.toml and
          # the lockfile disagree.
          cp requirements-lock.txt /tmp/requirements-lock.txt
          uv pip compile pyproject.toml --extra api --universal --python-version 3.10 \
            --generate-hashes --no-header -q -o /tmp/requirements-lock.txt
          if ! diff -q requirements-lock.txt /tmp/requirements-lock.txt; then
            echo "::error::requirements-lock.txt is out of date. Regenerate it with the command in README.md."
            exit 1
          fi
      - name: Audit runtime dependencies
        if: matrix.python-version == '3.12'
        run: |
          pip install "pip-audit>=2.7,<3"
          pip-audit --requirement requirements-lock.txt --require-hashes --disable-pip --progress-spinner off
      - name: Lint
        run: ruff check src tests
      - name: Run tests with coverage
        run: pytest --cov=sdebris --cov-report=term-missing --cov-report=xml
      - name: Check database migrations
        # `check` compares the models against a migrated database, so the
        # schema has to be built first. Without the upgrade it fails with
        # "target database is not up to date", which went unnoticed while the
        # lint step above was failing and stopping the job before this ran.
        env:
          SDEBRIS_DATABASE_URL: sqlite:///ci-migration-check.sqlite
        run: |
          alembic upgrade head
          alembic check
      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.xml

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Audit shipped dependencies
        # Scoped to what reaches a browser. The development tree carries
        # advisories in the linter's glob chain (braces, micromatch, reached
        # through eslint-config-next) whose advisory covers every published
        # version, so there is nothing to upgrade to; npm's only offered
        # remedy is downgrading eslint-config-next to 14.x, which does not
        # work with Next 16. Failing the build on an unfixable development
        # advisory trains people to ignore the step.
        run: npm audit --omit=dev --audit-level=high
      - name: Report development advisories
        continue-on-error: true
        run: npm audit --audit-level=high
      - run: npm run build
      - name: Build the Cloudflare Pages export
        # Production is this static export plus functions/. A route handler
        # or server-only API slipping into app/ breaks it, so it is built on
        # every push rather than discovered at deploy time.
        run: |
          npm run build:cloudflare
          test -f out/index.html
          test -f out/_headers
          test ! -e out/api
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          tags: sdebris:test
