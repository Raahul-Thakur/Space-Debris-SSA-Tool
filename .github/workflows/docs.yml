name: Docs

# Publishes the MkDocs site through GitHub's Pages deployment rather than by
# committing the built HTML to a `gh-pages` branch. That branch was the
# problem: Vercel builds every branch that receives a push, `gh-pages` has no
# `web/` directory, and so every docs change produced a failed Vercel build.
# A `vercel.json` cannot opt the branch out, because Vercel reads it from the
# project's root directory on the branch being built -- which is exactly the
# directory `gh-pages` lacks. With no branch pushed, there is nothing to build.
#
# Requires Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # One deployment at a time; a newer push supersedes one still queued.
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[docs]"
      - uses: actions/configure-pages@v6
      - name: Build the site
        run: mkdocs build --strict --site-dir site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
