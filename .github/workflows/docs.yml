name: Docs

# Publishes the MkDocs site through GitHub's Pages deployment rather than by
# committing the built HTML to a `gh-pages` branch. That branch was the
# problem: Vercel builds every branch that receives a push, `gh-pages` has no
# `web/` directory, and so every docs change produced a failed Vercel build.
# A `vercel.json` cannot opt the branch out, because Vercel reads it from the
# project's root directory on the branch being built -- which is exactly the
# directory `gh-pages` lacks. With no branch pushed, there is nothing to build.
#
# Requires Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# Read-only by default. Only the deploy job, which runs no third-party
# build code, gets permission to publish.
permissions:
  contents: read

concurrency:
  # One deployment at a time; a newer push supersedes one still queued.
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[docs]"
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Build the site
        run: mkdocs build --strict --site-dir site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
