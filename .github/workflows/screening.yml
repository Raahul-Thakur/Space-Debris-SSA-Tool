name: Scheduled screening

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch:
    inputs:
      norad:
        description: "Target NORAD id"
        default: "25544"
      group:
        description: "CelesTrak group"
        default: "iridium-33-debris"

permissions:
  contents: read

env:
  TARGET_NORAD: ${{ github.event.inputs.norad || '25544' }}
  TARGET_GROUP: ${{ github.event.inputs.group || 'iridium-33-debris' }}

jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package
        run: pip install -e .
      - name: Run conjunction screening
        env:
          SDEBRIS_WEBHOOK_URL: ${{ secrets.SDEBRIS_WEBHOOK_URL }}
        run: |
          sdebris screen --norad "$TARGET_NORAD" --group "$TARGET_GROUP" \
            --window-hours 72 --threshold-km 25 --alert
      - name: Upload screening report
        uses: actions/upload-artifact@v4
        with:
          name: screening-${{ env.TARGET_NORAD }}-${{ github.run_id }}
          path: |
            data/reports/*.csv
            data/reports/*.json
          if-no-files-found: error
          retention-days: 14
